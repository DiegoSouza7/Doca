# Exemplo doca — Next.js (front-end puro, sem serviços)
#
# Copie para a raiz do projeto como "doca.yml" e ajuste name/imagem/porta.
# Bind do código, userns, SELinux, cache, PATH, TZ e o shell vazio vêm do
# doca — o mesmo arquivo vale no Zorin, no Fedora e no Bazzite.
# Depois: cd projeto && doca

name: meu-front

services:
  app:
    # Nome completo: o Fedora recusa nome curto (node:24) sem um terminal.
    image: docker.io/library/node:24

    cpus: 2
    mem_limit: 6g

    env_file: [".env.local"]
    ports: ["3000:3000"]

    # Opcional. Sem estas variáveis vale o pnpm do corepack da imagem.
    # environment:
    #   # Fixa o gerenciador; obrigatório no Node 25+, que não traz o corepack.
    #   DOCA_PACKAGE_MANAGER: pnpm@10.34.9
    #   # Pacotes de sistema instalados no container (os nomes são da distro
    #   # da imagem). Saem no "doca down" e voltam na próxima subida.
    #   DOCA_PACKAGES: >-
    #     xvfb
