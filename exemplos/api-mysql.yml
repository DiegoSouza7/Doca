# Exemplo doca — API Node + MySQL
#
# Copie para a raiz do projeto como "doca.yml" e ajuste name/imagem/portas.
#
# Precisa de um .env na raiz com, no mínimo:
#   NODE_ENV=development
#   DB_PASSWORD=senha-do-banco
#   DB_NAME=nome-do-banco
# (use os nomes que o seu framework espera; ajuste as referências abaixo.)
#
# Depois: cd projeto && doca

name: minha-api

services:
  app:
    image: docker.io/library/node:24

    cpus: 2
    mem_limit: 8g

    env_file: [".env"]
    ports: ["3333:3333"]

    environment:
      # O .env costuma apontar o banco para localhost (porque funciona no PC).
      # Aqui dentro, localhost seria o próprio container — então mandamos para o
      # nome do serviço "mysql". environment vence env_file.
      # Use os nomes de variável que o seu framework lê.
      DB_HOST: mysql
      DB_PORT: "3306"

    # O doca espera o healthcheck do banco passar antes de te dar o shell.
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: docker.io/library/mysql:8

    # Sem env_file aqui: se o .env definir um usuário chamado "root", a imagem
    # recusa subir (root é reservado). Passamos só o necessário, interpolado
    # do .env.
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    # Publique a porta se quiser abrir o banco no seu editor de SQL (Beekeeper,
    # DBeaver...). Para a app falar com o banco isto NÃO é necessário — ela usa
    # a rede interna. Escolha uma porta livre no host.
    ports: ["3306:3306"]

    volumes:
      - db:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

# O volume "home" (cache) o doca cria; aqui só os de dado.
volumes:
  db:
